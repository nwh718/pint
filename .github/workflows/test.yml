name: Test and release when tagged

on:
  push:
    branches:
      - "master"
      - "develop"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: lint
      - run: pixi run --environment lint lint --all-files --show-diff-on-failure

  checks:
    name: ${{ matrix.task }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: benchmark
            os: ubuntu-22.04
          - task: typecheck
            os: ubuntu-latest
          - task: docs
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Python
        if: matrix.task == 'benchmark'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Setup pixi
        if: matrix.task == 'typecheck'
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: typecheck
          activate-environment: true

      - name: Setup pixi
        if: matrix.task == 'docs'
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: docs

      - name: Install numpy
        if: matrix.task == 'benchmark'
        run: pip install "numpy>=1.23,<2.0.0"

      - name: Install bench dependencies
        if: matrix.task == 'benchmark'
        run: pip install .[codspeed]

      - name: Run benchmarks
        if: matrix.task == 'benchmark'
        uses: CodSpeedHQ/action@v4.11.1
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: pytest . --codspeed
          mode: walltime

      - name: Run pyright
        if: matrix.task == 'typecheck'
        uses: jakebailey/pyright-action@v2
        continue-on-error: true
        with:
          version: PATH

      - name: Install locales
        if: matrix.task == 'docs'
        run: |
          sudo apt-get update
          sudo apt-get install language-pack-fr
          sudo localedef -i fr_FR -f UTF-8 fr_FR

      - name: Build docs
        if: matrix.task == 'docs'
        run: pixi run --environment docs docbuild

      - name: Run doctest
        if: matrix.task == 'docs'
        run: pixi run --environment docs doctest

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - test-py312
          - test-py313
          - test-py314
        numpy: [null, "numpy>=2.0.0,<2.1.0", "numpy>=2.4.0"]
        uncertainties: [null, "uncertainties==3.1.6", "uncertainties>=3.1.6,<4.0.0"]
        extras: [null]
        include:
          - environment: "test-py312"
            numpy: "numpy>=2.0.0,<2.1.0"
            extras: matplotlib==3.5.3
          - environment: "test-py312"
            numpy: "numpy"
            uncertainties: "uncertainties"
            extras: "sparse xarray netCDF4 dask[complete]==2024.5.1 graphviz babel==2.8 scipy pyyaml"
          - environment: "test-py312"
            numpy: "numpy>=2.0.0,<2.1.0"
            uncertainties: null
            extras: "babel==2.15 matplotlib==3.9.0"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: ${{ matrix.environment }}
          activate-environment: true
          log-level: vvv

      - name: Install pip
        run: pixi add pip

      - name: Install numpy
        if: ${{ matrix.numpy != null }}
        run: pixi run -e ${{ matrix.environment }} pip install "${{matrix.numpy}}"

      - name: Install uncertainties
        if: ${{ matrix.uncertainties != null }}
        run: pixi run -e ${{ matrix.environment }} pip install "${{matrix.uncertainties}}"

      - name: Install extras
        if: ${{ matrix.extras != null }}
        run: pixi run -e ${{ matrix.environment }} pip install ${{matrix.extras}}

      - name: Install locales
        if: ${{ matrix.extras != null }}
        run: |
          sudo apt-get update
          sudo apt-get install language-pack-es language-pack-fr language-pack-ro
          sudo localedef -i es_ES -f UTF-8 es_ES
          sudo localedef -i fr_FR -f UTF-8 fr_FR
          sudo localedef -i ro_RO -f UTF-8 ro_RO

      - name: Install dependencies
        run: |
          sudo apt install -y graphviz
          pixi run -e ${{ matrix.environment }} pip install packaging

      - name: Install pytest-mpl
        if: contains(matrix.extras, 'matplotlib')
        run: pixi run -e ${{ matrix.environment }} pip install pytest-mpl
      - run: pixi run --environment ${{ matrix.environment }} test

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        environment:
          - test-py312
          - test-py313
          - test-py314
        numpy: [null, "numpy>=2.0.0,<2.1.0", "numpy>=2.4.0"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          log-level: vvv
      - name: Install numpy
        if: ${{ matrix.numpy != null }}
        run: pip install "${{matrix.numpy}}"
      - run: pixi run --environment ${{ matrix.environment }} test

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        environment:
          - test-py312
          - test-py313
          - test-py314
        numpy: [null, "numpy>=2.4.0"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: ${{ matrix.environment }}
          log-level: vvv
      - name: Install numpy
        if: ${{ matrix.numpy != null }}
        run: pip install "${{matrix.numpy}}"
      - run: pixi run --environment ${{ matrix.environment }} test

  publish:
    if: github.ref_type == 'tag'
    needs: [test-linux, test-windows, test-macos, lint]

    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pint
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: build
      - name: Build the package
        run: pixi run --environment build build
      - name: Publish to PyPI
        run: pixi run --environment build publish